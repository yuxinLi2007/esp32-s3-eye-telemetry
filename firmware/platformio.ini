; ESP32-S3-EYE 没有官方 PlatformIO 板型，用 esp32-s3-devkitc-1 作基底自行覆盖。
; 关键差异：EYE 用的是 ESP32-S3-WROOM-1-N8R8（8MB flash + 8MB Octal PSRAM），
; 而 devkitc-1 默认按 qio_qspi / 无 PSRAM 处理，必须显式改掉。
[env:esp32s3eye]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size        = 8MB
board_upload.flash_size       = 8MB
board_build.partitions        = default_8MB.csv
board_build.arduino.memory_type = qio_opi

; EYE 的 USB 口走 GPIO19/20 原生 USB（枚举为 303A:1001 USB-Serial/JTAG），
; 而 Arduino 默认把 Serial 指向 UART0(GPIO43/44)——那对脚没接到 USB 口。
; 不开 CDC 的话串口一句日志都看不到。
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder

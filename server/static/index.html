<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32-S3-EYE 遥测</title>
<style>
  :root {
    --bg:#fafafa; --fg:#111; --dim:#666; --crit:#d93025;
    --line:#ddd; --grid:#e5e5e5;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .wrap { max-width:1200px; margin:0 auto; padding:12px 16px 48px; }

  /* 报警条：仅异常时出现（正常 / 主动停止时隐藏） */
  #alarm { display:flex; gap:10px; align-items:baseline; padding:10px 14px;
           font-size:14px; font-weight:600; }
  #alarm .sub { font-size:12px; font-weight:400; opacity:.85; }
  .a-crit { background:#fbdad7; color:#b31412; }
  .a-warn { background:#fdece6; color:#a63b00; }
  .a-info, .a-ok { background:#ececec; color:#555; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
           gap:10px; margin:12px 0; }
  .card { background:#fff; padding:10px 12px; }
  .card .k { font-size:11px; color:var(--dim); }
  .card .v { font-size:20px; font-weight:600; margin-top:2px; }
  .card.bad .v { color:var(--crit); }

  .chartbox { margin:12px 0; }
  canvas { width:100%; display:block; cursor:crosshair; }

  .ctlrow, .nl, .cmdrow { display:flex; gap:8px; align-items:center;
                          margin:12px 0; flex-wrap:wrap; }
  .btn { background:#fff; color:var(--fg); border:1px solid var(--line);
         border-radius:6px; padding:4px 12px; font:inherit; cursor:pointer; }
  .btn:hover:not(:disabled) { border-color:var(--dim); }
  .btn:disabled { opacity:.35; cursor:default; }
  .btn.halt { color:var(--crit); border-color:var(--crit); }
  #ctl_state { font-size:12px; color:var(--dim); }

  .nl input[type=text] { flex:1; min-width:200px; }
  #ask_out { flex-basis:100%; font-size:12px; }
  .ans { margin:2px 0; }
  .stat { color:var(--dim); }

  /* 第5周：四态色点（录音/识别/执行/播放）+ 运行位置标注 */
  .vstates { display:inline-flex; gap:5px; align-items:center; margin-left:2px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#d8d8d8;
         display:inline-block; }
  .dot.on { background:var(--crit); animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  .origin { font-size:10px; color:var(--dim); margin-left:2px; }

  input[type=text], input[type=number] { background:#fff; color:var(--fg);
      border:1px solid var(--line); border-radius:6px; padding:4px 8px; font:inherit; }
  input[type=text] { width:170px; }
  input[type=number] { width:86px; }

  .badge { display:inline-block; padding:1px 6px; border-radius:4px;
           font-size:11px; line-height:16px; background:#efefef; color:#333; }
  .b-pending, .b-claimed { background:#fdece6; color:#a63b00; }
  .b-running, .b-claimed-2 { background:#efefef; color:#333; }
  .b-failed, .b-timeout { background:#fbdad7; color:#b31412; }
  .b-expired { background:#fdece6; color:#a63b00; }
  .b-ntp_stale, .b-ntp_expired, .b-unsynced { background:#fbdad7; color:#b31412; }
  .b-ntp_fresh { background:#efefef; color:#333; }

  .tablewrap { max-height:340px; overflow:auto; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th,td { padding:5px 10px; text-align:right; white-space:nowrap; }
  th { position:sticky; top:0; background:#f0f0f0; color:var(--dim);
       font-weight:600; text-align:right; z-index:1; }
  td.l,th.l { text-align:left; }
  tr:nth-child(even) td { background:#f4f4f4; }
  td.mismatch { color:var(--crit); font-weight:600; }

  .bar { position:relative; height:6px; width:70px; background:#e0e0e0;
         border-radius:3px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:#666; }
  .cmd-detail { margin-top:12px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:12px; }
  .kv .k { color:var(--dim); }
  .kv .v { word-break:break-all; }
  .tl { list-style:none; margin:0; padding:0; font-size:11px; color:var(--dim); }
  .tl li { padding:3px 0; }
  pre.json { margin:0; padding:8px; background:#f0f0f0; border-radius:6px;
             overflow:auto; max-height:240px; font-size:11px; }
  .prov { }
</style>
</head>
<body>
<div id="alarm" class="a-crit" style="display:none">
  <span>正在连接服务端…</span><span class="sub"></span>
</div>

<div class="wrap">
  <section class="cards" id="cards"></section>

  <section class="chartbox">
    <canvas id="c_acc"></canvas>
  </section>

  <section class="ctlrow">
    <button class="btn" id="btn_start">开始采集</button>
    <button class="btn halt" id="btn_stop">停止采集</button>
    <span id="ctl_state"></span>
  </section>

  <section class="nl">
    <input type="text" id="ask_in" spellcheck="false" maxlength="500"
           placeholder="自然语言：查看数据 / 重新采集">
    <button class="btn" id="ask_btn">发送</button>
    <button class="btn" id="ptt_btn" title="按下开始录音，再按停止">按讲</button>
    <button class="btn halt" id="vt_stop" title="停止当前任务：停播报、撤销/停止关注、回空闲"
            style="display:none">停止</button>
    <span class="vstates" title="录音中 · 识别中 · 执行中 · 播放中">
      <i class="dot" id="st_rec"></i><i class="dot" id="st_asr"></i>
      <i class="dot" id="st_run"></i><i class="dot" id="st_play"></i>
      <span class="origin" id="voice_origin">电脑音频·浏览器</span>
    </span>
    <div id="ask_out"></div>
  </section>

  <section>
    <div class="cmdrow">
      <label>目标设备 MAC</label>
      <input type="text" id="cmd_mac" spellcheck="false" placeholder="AA:BB:CC:DD:EE:FF">
      <label>备注</label>
      <input type="text" id="cmd_note_text" style="width:200px" maxlength="200"
             placeholder="可选">
    </div>
    <div class="cmdrow" id="cmd_ops"></div>
    <div class="cmdrow">
      <span id="cmd_stats"></span>
      <button class="btn" id="cmd_refresh">刷新</button>
    </div>
    <div id="cmd_note"></div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th class="l">request_id</th><th class="l">指令</th><th class="l">状态</th>
          <th class="l">进度</th><th>耗时</th><th>样本 服务端/设备</th>
          <th class="l">结果</th><th class="l">操作</th>
        </tr></thead>
        <tbody id="cmd_tbody"></tbody>
      </table>
    </div>
    <div id="cmd_detail"></div>
    <div class="prov" id="prov"></div>
  </section>
</div>

<script>
// 与 firmware/include/config.h 保持一致
const UPLOAD_INTERVAL_MS = 2000;
// 与 server/db.py 保持一致
const NTP_FRESH_S = 300, NTP_STALE_S = 3600;

const ONLINE_MS  = UPLOAD_INTERVAL_MS * 3;   // 6s  正常上传节奏允许的范围
const OFFLINE_MS = UPLOAD_INTERVAL_MS * 7;   // 14s 连续 7 次没上传即判失联

const COL = { crit:'#d93025', fg:'#111', dim:'#666', grid:'#e5e5e5' };

const $ = id => document.getElementById(id);

const API = (() => {
  const q = new URLSearchParams(location.search).get('api');
  if (q) { try { localStorage.setItem('api_base', q); } catch (e) {} }
  if (location.protocol !== 'file:') return '';
  let saved = q || null;
  if (!saved) { try { saved = localStorage.getItem('api_base'); } catch (e) {} }
  return (saved || 'http://127.0.0.1:8000').replace(/\/+$/, '');
})();
const api = p => API + p;

let ctlToken = null;
try { ctlToken = localStorage.getItem('ctl_token'); } catch (e) {}
const ctlHeaders = () =>
  Object.assign({ 'Content-Type': 'application/json' },
                ctlToken ? { 'X-Control-Token': ctlToken } : {});

function trustOf(synced, age) {
  if (!synced || age === null || age === undefined) return 'unsynced';
  if (age <= NTP_FRESH_S) return 'ntp_fresh';
  if (age <= NTP_STALE_S) return 'ntp_stale';
  return 'ntp_expired';
}
const TRUST_TEXT = {
  ntp_fresh:   'NTP 新鲜',
  ntp_stale:   'NTP 陈旧',
  ntp_expired: 'NTP 已过期',
  unsynced:    '未同步',
};

const fmtTime = ms => ms === null || ms === undefined ? '—'
  : new Date(ms).toLocaleTimeString('zh-CN', { hour12:false }) + '.'
    + String(ms % 1000).padStart(3, '0');
const fmtAge = ms => ms < 1000 ? ms + ' ms' : (ms / 1000).toFixed(1) + ' s';

function stopIntervals(history, now) {
  const out = [];
  let open = null;
  for (const h of history || []) {
    if (!h.collect && open === null) open = h.t_server_ms;
    else if (h.collect && open !== null) { out.push([open, h.t_server_ms]); open = null; }
  }
  if (open !== null) out.push([open, now]);
  return out;
}

function buildSeries(rows, stops) {
  const byBatch = new Map();
  for (const r of rows) {
    const key = r.boot_id + '@' + r.t_server_recv_ms;
    let b = byBatch.get(key);
    if (!b) { b = { recv:r.t_server_recv_ms, boot:r.boot_id, maxDev:-Infinity, rows:[] };
              byBatch.set(key, b); }
    b.rows.push(r);
    if (r.t_device_ms > b.maxDev) b.maxDev = r.t_device_ms;
  }

  const pts = [];
  for (const b of byBatch.values()) {
    for (const r of b.rows) {
      const mag = (r.ax === null || r.ay === null || r.az === null)
        ? null : Math.hypot(r.ax, r.ay, r.az);
      pts.push({ x: b.recv + (r.t_device_ms - b.maxDev), mag, raw: r });
    }
  }
  pts.sort((a, z) => a.x - z.x);

  const segs = [], bands = [];
  let cur = null, prev = null;
  for (const p of pts) {
    let reason = null, kind = 'lost';
    if (prev) {
      const r = p.raw, q = prev.raw;
      if (r.boot_id !== q.boot_id)        reason = '设备重启 ' + q.boot_id + ' → ' + r.boot_id;
      else if (r.seq > q.seq + 1)         reason = '丢样 ' + (r.seq - q.seq - 1) + ' 个';
      else if (p.x - prev.x > UPLOAD_INTERVAL_MS * 3) {
        if ((stops || []).some(v => prev.x < v[1] && p.x > v[0])) {
          reason = '已停止采集'; kind = 'stopped';
        } else {
          reason = '上传中断 ' + fmtAge(p.x - prev.x);
        }
      }
    }
    if (reason || !cur) {
      if (reason) bands.push({ x0: prev.x, x1: p.x, reason, kind });
      cur = { pts: [] };
      segs.push(cur);
    }
    cur.pts.push(p);
    prev = p;
  }
  return { pts, segs, bands };
}

function drawChart(canvas, series, opts) {
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 800;
  const cssH = 170;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.height = cssH + 'px';
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, cssW, cssH);

  let L = 46; const R = 10, T = 10, B = 20;
  let pw = cssW - L - R; const ph = cssH - T - B;

  const all = series.pts.filter(p => p[opts.field] !== null && p[opts.field] !== undefined);
  if (!all.length || !series.pts.length) {
    g.fillStyle = COL.dim; g.font = '13px ui-monospace,monospace'; g.textAlign = 'center';
    g.fillText('无数据', cssW / 2, cssH / 2);
    return;
  }

  const xs = series.pts.map(p => p.x);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  x1 = Math.max(x1, Math.min(series.now, x1 + UPLOAD_INTERVAL_MS * 60));
  if (x1 <= x0) x1 = x0 + 1000;

  const vs = all.map(p => p[opts.field]);
  if (opts.include) vs.push(...opts.include);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = (hi - lo) * 0.15 || 0.05;
  lo -= pad; hi += pad;

  const gstep = (hi - lo) / 4;
  const dec = Math.min(6, Math.max(opts.decimals || 3,
    gstep > 0 ? Math.ceil(-Math.log10(gstep)) : (opts.decimals || 3)));
  if (dec > 3) { L = 46 + (dec - 3) * 7; pw = cssW - L - R; }

  const X = t => L + (t - x0) / (x1 - x0) * pw;
  const Y = v => T + (hi - v) / (hi - lo) * ph;

  g.font = '10px ui-monospace,monospace';
  g.textAlign = 'right'; g.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v);
    g.strokeStyle = COL.grid; g.beginPath();
    g.moveTo(L, y); g.lineTo(L + pw, y); g.stroke();
    g.fillStyle = COL.dim;
    g.fillText(v.toFixed(dec), L - 6, y);
  }
  g.textAlign = 'center'; g.textBaseline = 'top';
  for (let i = 0; i <= 5; i++) {
    const t = x0 + (x1 - x0) * i / 5;
    g.fillStyle = COL.dim;
    g.fillText(fmtTime(t).slice(0, 8), X(t), T + ph + 5);
  }

  // 缺口 = 红色竖带；主动停止 = 灰色竖带
  for (const b of series.bands) {
    const held = b.kind === 'stopped';
    const bx0 = Math.max(X(b.x0), L), bx1 = Math.max(X(b.x1), L);
    const w = Math.max(bx1 - bx0, 2);
    g.fillStyle = held ? 'rgba(120,120,120,.15)' : 'rgba(217,48,37,.20)';
    g.fillRect(bx0, T, w, ph);
    g.strokeStyle = held ? 'rgba(120,120,120,.6)' : 'rgba(217,48,37,.9)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(bx0 + w / 2, T); g.lineTo(bx0 + w / 2, T + ph); g.stroke();
  }

  // 最后一点之后到现在的空白：失联必须可见（停止时灰色、故障时红色）
  const lastX = Math.max(...xs);
  if (series.stopped) {
    const bx = Math.max(X(lastX), L);
    g.fillStyle = 'rgba(120,120,120,.12)';
    g.fillRect(bx, T, L + pw - bx, ph);
  } else if (series.now - lastX > ONLINE_MS) {
    const bx = Math.max(X(lastX), L);
    g.fillStyle = 'rgba(217,48,37,.10)';
    g.fillRect(bx, T, L + pw - bx, ph);
  }

  g.lineWidth = 1.4; g.strokeStyle = opts.color;
  g.lineJoin = 'round'; g.lineCap = 'round';
  for (const s of series.segs) {
    let pen = false;
    g.beginPath();
    for (const p of s.pts) {
      const v = p[opts.field];
      if (v === null || v === undefined) { pen = false; continue; }
      const px = X(p.x), py = Y(v);
      if (pen) g.lineTo(px, py); else { g.moveTo(px, py); pen = true; }
    }
    g.stroke();
  }
}

const el = (tag, cls, txt) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
};

function setAlarm(level, title, sub) {
  const a = $('alarm');
  a.className = 'a-' + level;
  a.innerHTML = '';
  a.appendChild(el('span', null, title));
  a.appendChild(el('span', 'sub', sub || ''));
  // 正常与主动停止不算异常：报警条只在真正有问题时出现
  a.style.display = (level === 'ok' || level === 'info') ? 'none' : 'flex';
}

let ctl = null;

function sampleRate(series) {
  const segs = series.segs;
  if (!segs.length) return null;
  const seg = segs[segs.length - 1].pts;
  const dts = [];
  for (let i = 1; i < seg.length; i++) {
    const d = seg[i].raw.t_device_ms - seg[i - 1].raw.t_device_ms;
    if (d > 0 && d < 60000) dts.push(d);
  }
  if (!dts.length) return null;
  dts.sort((a, b) => a - b);
  return Math.round(1000 / dts[(dts.length / 2) | 0]);
}

function renderCards(st, rows, series) {
  const cards = $('cards');
  cards.innerHTML = '';
  const last = st.last_batch;
  const rate = last ? sampleRate(series) : null;
  const defs = [
    { k: '最后接收时间',
      v: last ? fmtTime(last.t_server_recv_ms) : '—',
      cls: last && last.age_ms > OFFLINE_MS ? 'bad' : '' },
    { k: '采样率',
      v: rate ? rate + ' Hz' : '—',
      cls: '' },
    { k: 'NTP 可信等级',
      v: last ? (TRUST_TEXT[last.t_trust] || last.t_trust) : '—',
      cls: last && last.t_trust !== 'ntp_fresh' ? 'bad' : '' },
  ];
  for (const d of defs) {
    const c = el('div', 'card ' + (d.cls || ''));
    c.appendChild(el('div', 'k', d.k));
    c.appendChild(el('div', 'v', d.v));
    cards.appendChild(c);
  }
}

function renderControl() {
  const known = !!ctl;
  $('ctl_state').textContent = !known ? '采集状态未知'
    : (ctl.collect ? '采集：开' : '采集：已停止')
      + (ctl.changed_ago_ms === null ? '' : '（' + fmtAge(ctl.changed_ago_ms) + '前）');
  $('btn_start').disabled = !known || ctl.collect || ctlBusy;
  $('btn_stop').disabled  = !known || !ctl.collect || ctlBusy;
}

async function onControl(collect) {
  if (ctlBusy) return;
  ctlBusy = true;
  renderControl();
  try {
    let r = await fetch(api('/api/v1/control'), {
      method: 'POST', headers: ctlHeaders(),
      body: JSON.stringify({ collect, note: collect ? '界面手动开始' : '界面手动停止' }),
    });
    if (r.status === 401) {
      const t = window.prompt('服务端设置了 CONTROL_TOKEN，改变采集开关需要它：');
      if (t) { ctlToken = t; try { localStorage.setItem('ctl_token', t); } catch (e) {} }
      if (!t) throw new Error('未提供 CONTROL_TOKEN');
      r = await fetch(api('/api/v1/control'), {
        method: 'POST', headers: ctlHeaders(),
        body: JSON.stringify({ collect, note: collect ? '界面手动开始' : '界面手动停止' }),
      });
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
  } catch (e) {
    setAlarm('crit', (collect ? '开启' : '停止') + '采集失败', String(e.message || e));
  } finally {
    ctlBusy = false;
    tick();
  }
}

let inflight = false, ctlBusy = false;
async function tick() {
  if (inflight) return;
  inflight = true;
  try {
    const [sr, rr, cr] = await Promise.all([
      fetch(api('/api/v1/status'), { cache: 'no-store' }),
      fetch(api('/api/v1/readings?limit=3000'), { cache: 'no-store' }),
      fetch(api('/api/v1/control'), { cache: 'no-store' }),
    ]);
    if (!sr.ok || !rr.ok || !cr.ok) throw new Error('HTTP ' + sr.status + '/' + rr.status + '/' + cr.status);
    const st = await sr.json(), rd = await rr.json(), cd = await cr.json();
    ctl = cd;
    renderControl();
    const rows = rd.readings || [];
    const series = buildSeries(rows, stopIntervals(cd.history, st.server_time_ms));
    series.now = st.server_time_ms;
    series.stopped = !cd.collect;

    renderCards(st, rows, series);
    drawChart($('c_acc'), series, { field: 'mag', color: '#222', decimals: 3,
                                    refLine: 1.0, include: [1.0] });

    const last = st.last_batch;
    const missingN = series.bands.reduce((n, b) => {
      const m = /^丢样 (\d+)/.exec(b.reason);
      return n + (m ? parseInt(m[1], 10) : 0);
    }, 0);
    const recentDrop = last ? last.dropped_since_last : 0;
    const counts = rd.trust.counts || {};
    const nonFreshN = Object.entries(counts)
      .filter(([t]) => t !== 'ntp_fresh').reduce((n, [, c]) => n + c, 0);
    const stopped = !cd.collect;
    const ignoring = stopped && cd.t_server_ms !== null
      && last && last.t_server_recv_ms > cd.t_server_ms + OFFLINE_MS;

    if (!last) {
      setAlarm('crit', '无数据', rows.length ? '查询窗口内没有任何样本。'
               : '服务端从未收到任何批次。');
    } else if (ignoring) {
      setAlarm('warn', '已停止但仍在收到数据',
               fmtTime(last.t_server_recv_ms) + ' 后仍收到批次，设备未执行停止。');
    } else if (stopped) {
      setAlarm('info', '已停止采集' + (cd.changed_ago_ms === null ? ''
               : ' · ' + fmtAge(cd.changed_ago_ms) + '前停止'),
               '最后上传 ' + fmtTime(last.t_server_recv_ms) + '。');
    } else if (last.age_ms > OFFLINE_MS) {
      setAlarm('crit', '设备失联 · 已 ' + fmtAge(last.age_ms) + ' 无数据',
               '最后上传 ' + fmtTime(last.t_server_recv_ms) + '。');
    } else if (last.age_ms > ONLINE_MS) {
      setAlarm('warn', '数据延迟 · 最近一批 ' + fmtAge(last.age_ms) + ' 前', '');
    } else if (missingN > 0) {
      setAlarm('warn', '丢样 ' + missingN + ' 个', '缺口已在曲线上标红。');
    } else if (recentDrop > 0) {
      setAlarm('warn', '板上丢弃 ' + recentDrop + ' 个样本', '');
    } else if (nonFreshN > 0) {
      setAlarm('warn', '时间戳不可信 ' + nonFreshN + ' 个样本', '');
    } else if (st.total_dropped > 0) {
      setAlarm('warn', '历史累计丢弃 ' + st.total_dropped + ' 个样本', '');
    } else {
      setAlarm('ok', '链路正常', '');
    }
  } catch (e) {
    setAlarm('crit', '无法连接服务端', String(e.message || e));
  } finally {
    inflight = false;
  }
}

// ------------------------------------------------------------ 第4周：自然语言
let askTimer = null;

function renderCommandState(c, box) {
  let line;
  if (c.state === 'done') {
    if (c.op === 'image') {
      const r = c.result || {};
      if (r.captured_at_ms != null) {
        line = '图像采集完成：服务端 ' + fmtTime(r.captured_at_ms) + ' 收到（'
             + (r.source === 'replay' ? '回放' : '实拍') + '）';
      } else {
        line = '图像采集完成（未收到图像回执）';
      }
    } else {
      line = (c.n_samples > 0)
        ? '采集完成：服务端实收 ' + c.n_samples + ' 条样本'
        : '设备报告完成，但服务端未收到样本';
    }
  } else {
    line = c.state_text;
    if (!c.is_terminal && c.remaining_ms !== null) line += '（剩余 ' + fmtAge(c.remaining_ms) + '）';
  }
  box.textContent = line;
}

function pollCommand(rid, box, onTerminal) {
  clearInterval(askTimer);
  const step = async () => {
    try {
      const r = await fetch(api('/api/v1/commands/' + rid), { cache: 'no-store' });
      if (!r.ok) return;
      const c = (await r.json()).command;
      renderCommandState(c, box);
      if (c.is_terminal) {
        clearInterval(askTimer);
        if (onTerminal) onTerminal(box.textContent);
      }
    } catch (e) { /* 状态轮询失败不打断其它逻辑 */ }
  };
  step();
  askTimer = setInterval(step, 2000);
}

async function askText(text) {
  // 文字入口与语音入口共用同一条 NL 处理：查询/采集/澄清/取消全复用，不另写一套。
  let r = await fetch(api('/api/v1/assistant/chat'), {
    method: 'POST', headers: ctlHeaders(),
    body: JSON.stringify({ text, context_id: VOICE_CTX }),
  });
  if (r.status === 401) {
    const t = window.prompt('服务端设置了 CONTROL_TOKEN，请求采集/取消需要它：');
    if (!t) throw new Error('未提供 CONTROL_TOKEN');
    ctlToken = t; try { localStorage.setItem('ctl_token', t); } catch (e) {}
    r = await fetch(api('/api/v1/assistant/chat'), {
      method: 'POST', headers: ctlHeaders(),
      body: JSON.stringify({ text, context_id: VOICE_CTX }),
    });
  }
  if (!r.ok) {
    let d = null;
    try { d = await r.json(); } catch (e) {}
    throw new Error((d && d.error && d.error.message) || 'HTTP ' + r.status);
  }
  return await r.json();
}

async function onAsk() {
  const text = $('ask_in').value.trim();
  if (!text) return;
  clearInterval(askTimer);
  voiceEpoch++; stopSpeaking();          // 文字新输入 = 新任务：打断旧播报
  const out = $('ask_out');
  out.innerHTML = '';
  try {
    const j = await askText(text);
    if (isCancelIntent(j)) {
      appendMsg(j.answer); applyTiming(j);
      return;
    }
    out.appendChild(el('div', 'ans', j.answer));
    applyTiming(j);
    if (j.command) {
      const box = el('div', 'stat');
      out.appendChild(box);
      pollCommand(j.command.request_id, box);
    }
  } catch (e) {
    out.appendChild(el('div', 'ans', String(e.message || e)));
  }
}

// ------------------------------------------------------------ 第5周：按键说话
// 半双工：一次只走一个环节。录音中/识别中/执行中/播放中是四个色点（红=进行中）。
let rec = null, recChunks = [], recStream = null;

// ------------------------------------------------------------ 第6周：可澄清、可停止
// 会话上下文：整页自持一个 context_id（服务端按它记录澄清/取消/时序）。
// epoch：新任务 / 取消时 +1；迟到应答（旧任务的 TTS、迟到的指令终态播报）
// 一律按 epoch 对不上号丢弃——"新任务不被旧任务结果覆盖"的前端一半。
const VOICE_CTX = (globalThis.crypto && crypto.randomUUID
                  ? crypto.randomUUID()
                  : 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 14));
let voiceEpoch = 0;
let ttsAudio = null;

function setDot(which) {
  for (const k of ['rec', 'asr', 'run', 'play']) {
    const d = $('st_' + k);
    if (d) d.classList.toggle('on', k === which);
  }
}

function appendMsg(msg) {
  $('ask_out').appendChild(el('div', 'ans', msg));
}

async function pttStart() {
  if (rec) return;
  voiceEpoch++; stopSpeaking();          // 新语音任务：打断旧播报，旧任务应答作废
  clearInterval(askTimer);
  $('ask_out').innerHTML = '';
  setDot('rec');
  try {
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    setDot(null);
    appendMsg('录音失败：麦克风不可用');
    return;
  }
  recChunks = [];
  rec = new MediaRecorder(recStream);
  rec.ondataavailable = ev => { if (ev.data && ev.data.size) recChunks.push(ev.data); };
  rec.onstop = onPttStop;
  rec.start();
  $('ptt_btn').textContent = '停止';
}

function pttStop() {
  if (!rec) return;
  rec.stop();
  if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
  $('ptt_btn').textContent = '按讲';
}

async function onPttStop() {
  const mr = rec; rec = null;
  const blob = new Blob(recChunks, { type: (mr && mr.mimeType) || 'audio/webm' });
  if (!blob.size) { setDot(null); appendMsg('识别失败：无有效语音'); return; }
  const myEpoch = voiceEpoch;              // 本次语音任务快照：迟到应答对不上号就丢
  setDot('asr');
  try {
    const fd = new FormData();
    fd.append('file', blob, 'ptt.webm');
    let r = await fetch(api('/api/v1/voice/transcribe'), { method: 'POST', body: fd });
    if (!r.ok) {
      let d = null; try { d = await r.json(); } catch (e) {}
      throw new Error((d && d.error && d.error.message) || '识别失败：HTTP ' + r.status);
    }
    const text = (await r.json()).text;
    if (!text) throw new Error('识别失败：无有效语音');
    // 识别出的文本走第 4 周同一条 NL 处理（查询/采集/澄清/取消全复用）
    setDot('run');
    const j = await askText(text);
    if (voiceEpoch !== myEpoch) return;    // 已取消/被新任务顶掉：迟到应答不播不显示
    appendMsg(j.answer);
    applyTiming(j);
    if (isCancelIntent(j)) {
      // 语音口令"取消/停止"：播报一句确认即可，其余内容一律不碰
      await ttsSpeak(j.answer, myEpoch);
      return;
    }
    if (j.command) {
      // 采集：等指令终态后再播报"最终回答"，避免把中间态说成结果。
      const box = el('div', 'stat');
      $('ask_out').appendChild(box);
      pollCommand(j.command.request_id, box, async t => {
        if (voiceEpoch !== myEpoch) return; // 迟到终态：任务已被取消/顶掉，不播
        try {
          const rc = await fetch(api('/api/v1/voice/context')
            + '?context_id=' + encodeURIComponent(VOICE_CTX), { cache: 'no-store' });
          const jc = await rc.json();
          const tl = jc.context && jc.context.timing;
          if (tl && tl.latency_ms != null) appendMsg('⏱ 完成延迟 ' + tl.latency_ms + 'ms');
        } catch (e) { /* 拿不到计时不影响播报 */ }
        ttsSpeak(t, myEpoch);
      });
      return;
    }
    await ttsSpeak(j.answer, myEpoch);
  } catch (e) {
    if (voiceEpoch !== myEpoch) return;
    setDot(null);
    appendMsg(String(e.message || e));
  }
}

// 第6周：停止播报 + 回到空闲
function stopSpeaking() {
  if (ttsAudio) {
    try { ttsAudio.pause(); ttsAudio.src = ''; } catch (e) {}
    ttsAudio = null;
  }
  setDot(null);
  clearInterval(askTimer);
}

// 文字停止按钮（备用路径）：停播报、断轮询，让服务端撤销/停止关注
function doCancel() {
  voiceEpoch++;
  stopSpeaking();
  appendMsg('已停止播报，正在撤销任务…');
  askText('取消')
    .then(j => {
      appendMsg(j.answer);
      applyTiming(j);
    })
    .catch(e => appendMsg(String(e.message || e)));
}

function isCancelIntent(j) {
  return !!(j && j.intent && j.intent.action === 'cancel');
}

// 首答延迟展示（输入结束 → 首次反馈）
function applyTiming(j) {
  const t = j && j.context && j.context.timing;
  if (t && t.ttff_ms != null) appendMsg('⏱ 首答 ' + t.ttff_ms + 'ms');
}

async function ttsSpeak(text, epoch = voiceEpoch) {
  if (!text) return;
  if (epoch !== voiceEpoch) return;        // 迟到：已被取消/新任务顶掉
  setDot('play');
  try {
    const r = await fetch(api('/api/v1/voice/speak'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!r.ok) {
      let d = null; try { d = await r.json(); } catch (e) {}
      throw new Error((d && d.error && d.error.message) || '合成失败：HTTP ' + r.status);
    }
    if (epoch !== voiceEpoch) return;      // 合成回来前已被打断
    const audio = new Audio(URL.createObjectURL(await r.blob()));
    ttsAudio = audio;
    await new Promise(res => {
      audio.onended = () => { if (ttsAudio === audio) ttsAudio = null; res(); };
      audio.onerror = () => { if (ttsAudio === audio) ttsAudio = null; res(); };
      audio.play().catch(() => { if (ttsAudio === audio) ttsAudio = null; res(); });
    });
  } catch (e) {
    appendMsg(String(e.message || e));
  } finally {
    if (epoch === voiceEpoch) setDot(null);
  }
}

(async () => {
  // 运行位置：服务端如实告诉你音频来源（设备音频已接通才标"设备音频"）
  try {
    const r = await fetch(api('/api/v1/voice/info'), { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      $('voice_origin').textContent =
        j.device_audio ? '设备音频·板载I2S' : '电脑音频·浏览器';
    }
  } catch (e) { /* 拿不到就保持默认标注 */ }
})();

$('btn_start').addEventListener('click', () => onControl(true));
$('btn_stop').addEventListener('click', () => onControl(false));
$('ask_btn').addEventListener('click', onAsk);
$('ask_in').addEventListener('keydown', ev => { if (ev.key === 'Enter') onAsk(); });
$('ptt_btn').addEventListener('click', () => { if (rec) pttStop(); else pttStart(); });
$('vt_stop').addEventListener('click', doCancel);
window.addEventListener('resize', tick);
tick();
setInterval(tick, UPLOAD_INTERVAL_MS);

// 交给 commands.js 复用。
window.DASH = {
  $, api, el, setAlarm, fmtTime, fmtAge, COL, trustOf, TRUST_TEXT, ctlHeaders,
  get ctlToken() { return ctlToken; },
  setCtlToken(t) {
    ctlToken = t;
    try { localStorage.setItem('ctl_token', t); } catch (e) {}
  },
};
</script>
<script src="commands.js"></script>
</body>
</html>
